<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Cain Finance 728x90</title>
<meta name="robots" content="noindex,nofollow">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:728px;
    height:90px;
    overflow:hidden;
    font-family:Inter,Arial,sans-serif;
}

body{
    background:#060606;
}

.banner{
    width:728px;
    height:90px;
    position:relative;
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 22px;
    border:1px solid rgba(200,182,138,.18);
    background:
        radial-gradient(circle at 85% 50%, rgba(200,182,138,.12), transparent 60%),
        linear-gradient(180deg,#090909,#050505);

    /* Remove default link styling */
    text-decoration:none;
    color:inherit;
}
/* subtle animated glow */

.banner:before{
    content:"";
    position:absolute;
    width:280px;
    height:280px;
    border-radius:50%;
    background:radial-gradient(circle,
    rgba(200,182,138,.25),
    transparent 70%);
    right:-100px;
    top:-90px;
    animation:float 8s ease-in-out infinite;
}

@keyframes float{
    50%{
        transform:translate(-30px,10px);
    }
}

.logo{
    display:flex;
    align-items:center;
    gap:12px;
    z-index:2;
}

.icon{
    width:42px;
    height:42px;
    border-radius:12px;
    background:linear-gradient(135deg,#e4d4a8,#c8b68a);
    display:flex;
    align-items:center;
    justify-content:center;
    color:#111;
    font-weight:bold;
    font-size:20px;
    box-shadow:0 0 25px rgba(200,182,138,.45);
}

.brand{
    color:#fff;
    font-size:24px;
    font-weight:700;
}

.brand span{
    color:#c8b68a;
    font-weight:400;
}

.content{
    flex:1;
    padding:0 28px;
    z-index:2;
}

.headline{
    color:#fff;
    font-size:23px;
    font-weight:700;
    letter-spacing:-.03em;
}

.sub{
    color:#999;
    font-size:12px;
    margin-top:5px;
}

.gold{
    color:#c8b68a;
}

.cta{
    z-index:2;
}

.button{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    padding:12px 22px;
    background:linear-gradient(135deg,#e4d4a8,#c8b68a);
    color:#090909;
    border-radius:10px;
    text-decoration:none;
    font-weight:700;
    font-size:14px;
    transition:.3s;
    box-shadow:0 0 20px rgba(200,182,138,.25);
}

.button:hover{
    transform:translateY(-2px);
    box-shadow:0 0 28px rgba(200,182,138,.45);
}

/* animated accent */

.line{
    position:absolute;
    left:-200px;
    top:0;
    width:200px;
    height:100%;
    background:linear-gradient(90deg,
        transparent,
        rgba(228,212,168,.18),
        transparent);
    transform:skewX(-25deg);
    animation:sweep 5s linear infinite;
}

@keyframes sweep{
    to{
        left:900px;
    }
}
</style>
</head>

<body>

<a class="banner" href="https://cain.finance" target="_blank">

<div class="line"></div>

<div class="logo">
    <div class="icon">C</div>
    <div class="brand">
        cain <span>finance</span>
    </div>
</div>

<div class="content">
    <div class="headline">
        Earn Institutional Yield on <span class="gold">Solana</span>
    </div>
    <div class="sub">
        Auto-compounding vaults • Real-world assets • Non-custodial
    </div>
</div>

<div class="cta">
    <div class="button">
        Launch App →
    </div>
</div>

</a>

</body>
</html>
